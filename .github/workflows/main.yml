name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o donut-ai-fabric-1.21.11-buildable.zip
          cd donut-ai-fabric-1.21.11-buildable
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: donut-ai-mod
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
